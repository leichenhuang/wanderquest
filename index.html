<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="WANDERQUEST — a bilingual (繁中 / English) story puzzle game set in Maokong, Taipei. Playtest v4.0.0-alpha.1.">
<meta name="theme-color" content="#16392f">
<title>WANDERQUEST · 貓空三夜</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%84%3C/text%3E%3C/svg%3E">
<style>
:root{
  --pine:#16392f;--pine2:#21503f;--leaf:#3f7a5c;--moss:#7fae7a;--paper:#fbf6e8;--paper2:#f3ecd8;
  --ink:#213a31;--muted:#5f7067;--gold:#e2b45c;--gold2:#f3d58f;--cap:#c4553a;--line:#d9d2bb;
  --ok:#2f7d55;--bad:#b4472f;--glow:#c9f0a8;
  --r:16px;--shadow:0 10px 30px rgba(20,50,40,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#dfe6d6;color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;border:1.5px solid #b9c8b6;border-radius:12px;padding:10px 14px;background:#fffdf6;min-height:44px;transition:transform .12s,background .15s,box-shadow .15s}
button:hover{background-color:#eef5e8}
.tile:hover{background-color:#cfd9c8}
button:not(.hot):not(.node):active{transform:scale(.97)}
.hot:active,.node:active{transform:translate(-50%,-50%) scale(.96)}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--pine);color:#fff;border-color:var(--pine);font-weight:700}
.btn-primary:hover{background:var(--pine2)}
.btn-gold{background:var(--gold2);border-color:#c79a45;color:#2b2a1c;font-weight:700}
.btn-gold:hover{background:#f7df9f}
.btn-ghost{background:transparent;border-color:transparent}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:13px}
h1,h2,h3{line-height:1.25;margin:.2em 0 .45em}
a{color:var(--pine2)}

/* ---------- full-screen overlays (onboarding) ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 30% 20%,#24584a,#0b221d 70%);color:#f6efd9;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.ob-card{width:min(860px,100%);background:linear-gradient(150deg,rgba(33,80,63,.95),rgba(12,36,31,.97));border:1px solid #5d8676;border-radius:24px;padding:clamp(20px,4vw,40px);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.ob-kicker{letter-spacing:.28em;font-size:12px;color:var(--gold2);text-transform:uppercase}
.ob-title{font-size:clamp(34px,7vw,64px);letter-spacing:.06em;margin:6px 0;color:#fbe9b6;font-weight:900}
.ob-card p{color:#dfe8dc}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.lang-grid button{min-height:120px;font-size:26px;font-weight:800;background:#1b4337;color:#fff;border:2px solid #7ea08d;border-radius:18px}
.lang-grid button small{display:block;font-size:14px;font-weight:400;opacity:.85;margin-top:4px}
.lang-grid button:hover{background:var(--gold2);color:var(--pine)}
.field{display:block;margin:14px 0}
.field span{display:block;font-size:14px;margin-bottom:6px;color:#e9e2c8}
.field input,.field select{width:min(420px,100%);padding:12px;border-radius:12px;border:1px solid #9fb8a6;background:#fff;color:#1f3a30;min-height:46px}
.ob-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.ob-actions .btn-ghost{color:#e6dcc0}

/* story film */
.film{position:relative;height:min(52vw,420px);min-height:260px;border-radius:20px;overflow:hidden;border:2px solid #9fb69c;background:#0e2a25}
.film svg{position:absolute;inset:0;width:100%;height:100%}
.film .mossy-in{position:absolute;bottom:4%;left:5%;width:clamp(90px,17vw,150px);border-radius:18px;opacity:0;transform:translateY(30px);transition:1s ease}
.film.s2 .mossy-in,.film.s3 .mossy-in{opacity:1;transform:none}
.film .fade-title{position:absolute;top:12%;left:0;right:0;text-align:center;font-weight:900;letter-spacing:.35em;font-size:clamp(22px,5vw,44px);color:#f4dca0;opacity:0;transition:1.2s;text-shadow:0 4px 18px #000}
.film.s1 .fade-title{opacity:1}
.film.s3 .fade-title{opacity:0}
.subtitle{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 14px 18px;background:linear-gradient(transparent,rgba(5,20,18,.92) 35%);font-weight:700;font-size:clamp(15px,2.3vw,20px);text-shadow:0 2px 3px #000;min-height:76px}
.film.s2 .subtitle,.film.s3 .subtitle{padding-left:clamp(110px,20vw,175px)}
.myc{stroke:#c9f0a8;stroke-width:2.2;fill:none;stroke-dasharray:6 7;animation:flow 2.4s linear infinite;filter:drop-shadow(0 0 6px #c9f0a8)}
.film.s1 .myc{animation:flow 2.4s linear infinite,fadeout 4s ease forwards}
.film.s2 .myc,.film.s3 .myc{opacity:.12}
.myc.restore{opacity:0;transition:opacity 1.5s}
.film.s3 .myc.restore{opacity:1;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
@keyframes fadeout{to{opacity:.1}}
.timebar{height:6px;border-radius:9px;background:#45685c;margin-top:12px;overflow:hidden}
.timebar>div{height:100%;width:0;background:var(--gold2);transition:width .2s linear}
.film-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.film-controls button{background:#1d4639;color:#fff;border-color:#6f9381;min-height:40px;padding:7px 12px}

/* ---------- app shell ---------- */
.app{max-width:1240px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 50px rgba(0,0,0,.08);display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--pine);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.1em;font-size:17px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand small{font-weight:400;letter-spacing:.05em;opacity:.75;font-size:12px}
.topbar button{background:#24584a;color:#fff;border-color:#4d7d6b;min-height:40px;padding:7px 11px;font-size:14px}
.topbar button:hover{background:#2e6957}
.topbar .bag-btn{position:relative}
.count{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#2b2a1c;border-radius:20px;font-size:11px;font-weight:800;padding:1px 6px}
.objective{background:#fff4d6;border-bottom:1px solid #ecdcae;padding:9px 16px;font-size:14px;display:flex;gap:10px;align-items:center}
.objective b{color:#7a5517;white-space:nowrap}
.view{flex:1;padding:16px;display:block}
.storage-warn{background:#ffe3d6;color:#6b2a14;padding:8px 14px;font-size:13px}

/* world map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.worldmap{position:relative;background:#cfe0c4;border-radius:22px;overflow:hidden;border:3px solid #c4d3b6;aspect-ratio:16/11}
.worldmap svg.mapbg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;padding:0;background:none;border:0;min-height:0}
.node .dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:#fffdf3;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.node .lbl{font-size:12px;font-weight:700;background:rgba(255,253,243,.92);padding:1px 7px;border-radius:9px;white-space:nowrap}
.node.locked .dot{background:#dbe2d6;filter:grayscale(1);opacity:.75;width:36px;height:36px;font-size:15px}
.node.locked .lbl{opacity:.7;font-weight:500}
.node.open .dot{border-color:var(--gold);animation:pulse 1.6s ease-in-out infinite}
.node.done .dot{background:#d9f0d6;border-color:var(--ok)}
.node:hover{background:none}
.hot:hover{transform:translate(-50%,-50%)}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(226,180,92,.25),0 4px 12px rgba(0,0,0,.25)}}
.sidecard{background:#fffdf8;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:22px;height:4px;border-radius:3px;vertical-align:middle;margin-right:5px}

/* scene */
.scene-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chapter{display:inline-block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7a5517;background:#fbe9bd;border-radius:20px;padding:3px 10px}
.zh-sign{display:inline-block;font-size:12px;background:#2f5a49;color:#fff;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle;letter-spacing:.05em}
.scenebox{position:relative;border-radius:22px;overflow:hidden;border:3px solid #c9d4bd;aspect-ratio:16/9;background:#a9c9b4;margin:10px 0}
.scenebox svg{position:absolute;inset:0;width:100%;height:100%}
.hot{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;background:rgba(255,251,236,.95);border:2px solid #fff;border-radius:30px;padding:6px 12px 6px 8px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(15,45,35,.35);min-height:40px;white-space:nowrap}
.hot .ico{font-size:20px}
.hot.new::after{content:"";position:absolute;inset:-6px;border-radius:34px;border:2px solid var(--glow);animation:ring 1.6s ease-out infinite;pointer-events:none}
.hot.seen{background:rgba(236,244,232,.93)}
.hot.locked{opacity:.88}
@keyframes ring{from{opacity:1;transform:scale(.9)}to{opacity:0;transform:scale(1.15)}}
.npcbar{display:flex;gap:12px;align-items:center;background:#e9f2e3;border:1px solid #cfdfc8;border-radius:var(--r);padding:10px 12px}
.npcbar img{width:64px;height:72px;object-fit:cover;object-position:top;border-radius:14px;background:#f6efdc;flex:0 0 auto}
.npcbar p{margin:0}
.npcbar .talk{margin-left:auto;flex:0 0 auto}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.step{font-size:13px;border-radius:20px;padding:4px 11px;background:#eef1e6;border:1px solid #d7dccb}
.step.done{background:#dcefd8;border-color:#a8d0a2}
.step.now{background:#fff0c9;border-color:#e3bf6c;font-weight:700}

/* modal / sheet */
.modal{position:fixed;inset:0;z-index:40;background:rgba(12,32,27,.7);display:flex;align-items:center;justify-content:center;padding:14px}
.sheet{background:var(--paper);border-radius:22px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:var(--shadow);position:relative}
.sheet.wide{width:min(980px,100%)}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:20px;flex:1}
.sheet-body{padding:16px 18px 20px}
.close{min-height:40px;padding:6px 12px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:2px 7px;text-transform:uppercase}
.tag.fact{background:#dbeeff;color:#18456b}
.tag.fiction{background:#f7e2f2;color:#6d2459}
.card{background:#fffdf8;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.clue{border-left:5px solid var(--gold)}
.feedback{margin:12px 0;padding:11px 13px;border-radius:12px;font-size:15px}
.feedback.bad{background:#fde8e1;color:#6e2615;border:1px solid #f0bfae}
.feedback.ok{background:#e0f2df;color:#1f5a35;border:1px solid #afd6ad}
.feedback.info{background:#fff3d4;color:#5e4512;border:1px solid #ecd79c}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* jigsaw */
.jig{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:start}
.board{display:grid;gap:3px;background:#8aa792;padding:3px;border-radius:10px;width:100%;max-width:440px;margin:0 auto}
.board.n4{grid-template-columns:repeat(4,1fr)}
.board.n2{grid-template-columns:repeat(2,1fr);max-width:240px}
.tile{aspect-ratio:1;padding:0;min-height:0;border:0;border-radius:3px;background-repeat:no-repeat;background-color:#cfd9c8;position:relative}
.tile.sel{outline:4px solid var(--gold);outline-offset:-4px;z-index:1;transform:scale(1.04)}
.tile:hover{filter:brightness(1.06)}
.tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;background:#ece4cc;border:2px dashed #c9b88a;border-radius:12px;padding:10px}
.tray .tile{width:88px}
.tray-label{font-size:13px;text-align:center;margin:6px 0}

/* logic */
.logic-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
table.logic{border-collapse:collapse;width:100%}
.logic th,.logic td{border:1px solid #c9d5c4;padding:4px;text-align:center;font-size:14px}
.logic thead th{background:#eef2e6;font-size:13px}
.logic tbody th{background:#f5f1e3;text-align:left;font-size:13px}
.logic td button{width:100%;min-height:46px;font-size:20px;font-weight:800;padding:0;border-radius:8px}
.logic td button.m1{color:var(--bad);background:#fbefe9}
.logic td button.m2{color:#fff;background:var(--ok);border-color:var(--ok)}
.cluelist{margin:0;padding-left:0;list-style:none}
.cluelist li{padding:8px 10px;border-radius:10px;background:#fffaf0;border:1px solid #eadfc0;margin-bottom:6px;font-size:14px}
.cluelist li.missing{background:#f1f1ec;color:#8a918a;border-style:dashed}

/* overlay map */
.ovwrap{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#d8e7cf;border:2px solid #b6c9aa}
.ovwrap svg{position:absolute;inset:0;width:100%;height:100%}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;justify-content:center;margin:12px auto}
.pad button{padding:0;font-size:22px}
.legendbox{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px;align-items:center}
.legendbox .g{font-size:22px;text-align:center;font-weight:800;color:#8a4f2b}

/* potholes */
.potwrap{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:5/3;border-radius:14px;overflow:hidden;border:2px solid #9fb1a7}
.potwrap svg{position:absolute;inset:0;width:100%;height:100%}
.potwrap svg .pot{cursor:pointer}
.potwrap svg .pot:hover .rim{stroke:#f3d58f}
.seq{display:flex;gap:8px;justify-content:center;align-items:center;margin:10px 0;flex-wrap:wrap}
.seq span{min-width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:#fff;border:2px dashed #c4c9b8;font-weight:800;font-size:18px}
.seq span.f{border-style:solid;border-color:var(--leaf);background:#e3f0dd}

/* bag */
.bag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.item{background:#fffdf8;border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.item .ico{font-size:30px}
.item.sel{border-color:var(--gold);background:#fff4d6;box-shadow:0 0 0 3px rgba(226,180,92,.35)}
.item button{margin-top:auto}

/* gate */
.gate{display:flex;justify-content:center;gap:22px;margin:10px 0 16px;flex-wrap:wrap}
.socket{width:150px;text-align:center}
.socket .hole{width:110px;height:110px;margin:0 auto 6px;border-radius:50%;background:radial-gradient(circle,#264c40,#0f2a23);border:4px solid #8fb39b;display:grid;place-items:center;font-size:40px;color:#c9f0a8;box-shadow:inset 0 0 20px #000}
.socket.filled .hole{background:radial-gradient(circle,#4f8d6e,#1d4a3a);box-shadow:0 0 24px var(--glow),inset 0 0 12px #000}

/* dialog */
.dlg{display:flex;gap:14px;align-items:flex-start}
.dlg img{width:96px;height:110px;object-fit:cover;object-position:top;border-radius:16px;background:#f6efdc;flex:0 0 auto}
.dlg .bubble{background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 14px;flex:1}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choices button{text-align:left}

/* toast */
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);background:#183d34;color:#fff;padding:12px 18px;border-radius:14px;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;box-shadow:var(--shadow);font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ending */
.ending{text-align:center;padding:10px}
.ending .core{font-size:70px;filter:drop-shadow(0 0 22px var(--glow));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.stats div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--cap);color:#fff!important;text-decoration:none;font-weight:800;padding:14px 22px;border-radius:14px;font-size:17px;box-shadow:0 6px 18px rgba(196,85,58,.35)}
.cta:hover{filter:brightness(1.07)}

/* tutorial coach */
.coach{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:45;width:min(640px,94vw);background:#173d33;color:#fff;border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.4);border:2px solid var(--gold2)}
.coach img{width:58px;height:64px;object-fit:cover;object-position:top;border-radius:12px;background:#f6efdc}
.coach p{margin:0;font-weight:600}
.coach .cstep{font-size:12px;color:var(--gold2);letter-spacing:.1em}
.coach button{background:#24584a;color:#fff;border-color:#5f8c79;min-height:36px;padding:5px 10px;font-size:13px;margin-left:auto;flex:0 0 auto}
.pulse-target{animation:target 1.2s ease-in-out infinite;z-index:3}
button.pulse-target:not(.hot):not(.node){position:relative}
@keyframes target{50%{box-shadow:0 0 0 8px rgba(243,213,143,.75)}}
.tut-banner{background:#173d33;color:var(--gold2);text-align:center;font-weight:800;letter-spacing:.12em;padding:6px;font-size:13px}

@media (max-width:900px){
  .mapwrap{grid-template-columns:1fr}
  .jig{grid-template-columns:1fr}
  .logic-wrap{grid-template-columns:1fr}
}
@media (max-width:600px){
  body{font-size:15px}
  .view{padding:10px}
  .brand small{display:none}
  .topbar{padding:6px 8px;gap:6px}
  .topbar button{padding:6px 8px;font-size:13px}
  .topbar .lbl-txt{display:none}
  .lang-grid{grid-template-columns:1fr}
  .lang-grid button{min-height:80px}
  .hot{font-size:12px;padding:4px 9px 4px 6px;min-height:36px}
  .hot .ico{font-size:17px}
  .hot .htxt{max-width:92px;overflow:hidden;text-overflow:ellipsis}
  .scenebox{aspect-ratio:4/3}
  .node .dot{width:38px;height:38px;font-size:17px}
  .node.locked .dot{width:28px;height:28px;font-size:12px}
  .node .lbl{font-size:10px;padding:0 4px}
  .node.locked .lbl{display:none}
  .tray .tile{width:70px}
  .sheet-body{padding:12px}
  .modal{padding:0;align-items:stretch}
  .sheet{border-radius:0;max-height:100vh;height:100%}
  .dlg img{width:70px;height:80px}
  .coach{bottom:8px;padding:9px 10px}
  .coach img{width:44px;height:50px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* "next step" guide: the one thing to tap next bounces and gets a callout */
.hot.next,.node.next{z-index:6}
.hot.next{background:#fff3c4;border-color:var(--gold);box-shadow:0 0 0 4px rgba(226,180,92,.45),0 6px 18px rgba(15,45,35,.4);animation:hopHot 1.1s ease-in-out infinite}
.node.next{animation:hopNode 1.1s ease-in-out infinite}
.node.next .dot{border-color:var(--cap);box-shadow:0 0 0 6px rgba(196,85,58,.3),0 4px 12px rgba(0,0,0,.25)}
.hot.next::before,.node.next::before{content:attr(data-next);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--cap);color:#fff;font-size:13px;font-weight:800;padding:3px 10px;border-radius:10px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.3);pointer-events:none}

  background:rgba(251,246,232,.97);color:#2b2219;border:2px solid #6b4a2a;border-radius:18px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:opUp .35s ease-out}

 potholes:{type:"fact", zh:{t:"壺穴是怎麼形成的？", b:"壺穴是溪床岩盤上圓形或橢圓形的凹洞。水流在岩面的低窪處形成漩渦，帶著砂石不斷旋轉、磨蝕岩石，凹洞便慢慢加深、擴大。這需要很長的時間，也和岩石的軟硬、水量與砂石多寡有關。"},
   en:{t:"How do potholes form?", b:"Potholes are round or oval hollows in a streambed’s bedrock. Where water swirls in a dip in the rock, it spins sand and pebbles around and around, grinding the hollow deeper and wider. This takes a very long time, and depends on how hard the rock is, how much water flows and how much sediment it carries."}},
 name:{type:"fact", zh:{t:"「貓空」這個名字", b:"貓空一帶的溪谷岩床佈滿壺穴，坑坑洞洞、凹凸不平。臺語形容這種樣子為「皺空」（jiàu-khang），日治時期改寫為發音相近的「貓空」，地名就此沿用。所以「貓空」和貓咪其實沒有直接關係！"},
   en:{t:"The name “Maokong”", b:"The rocky streambeds here are full of potholes, bumpy and uneven. In Taiwanese, that look was described as “jiàu-khang” (皺空, roughly “wrinkled hollows”). During the Japanese colonial era it was written with the similar-sounding characters 貓空 — literally “cat + empty”. So the name has nothing to do with cats!"}},
 crosscut:{type:"fact", zh:{t:"小岩的野外筆記：截切關係", b:"地質學家判斷先後順序時，常用「截切關係」：如果一個地質特徵切過另一個，切過去的那個比較年輕。在溪床上，新的壺穴變大時會咬破旁邊舊壺穴的邊緣——邊緣保持完整的較年輕，被咬掉一塊的較古老。"},
   en:{t:"Pebble’s field note: cross-cutting", b:"Geologists often use the principle of cross-cutting relationships: if one feature cuts across another, the one doing the cutting is younger. In a streambed, a growing new pothole bites into the rim of an older neighbour. The pothole whose rim stays complete is younger; the one with a bite taken out is older."}}

/* extra fact cards used by the new stations (all marked fact unless type:fiction) */
const DOCS2 = {
 terraces:{type:"fact", zh:{t:"山坡上的茶園", b:"貓空是木柵鐵觀音與文山包種茶的主要產地。山坡上開闢成一層一層的茶園，便於種植與排水，也成為貓空最具代表性的風景。"}, en:{t:"Tea on the hillsides", b:"Maokong is a main growing area for Muzha Tieguanyin and Wenshan Baozhong. The slopes were cut into terraces for planting and drainage — today the most iconic view of Maokong."}},
 teahouses:{type:"fact", zh:{t:"從茶園到茶館", b:"1980 年木柵觀光茶園成立後，茶農開放茶園給市民參觀，上山喝茶的茶館文化逐漸興盛；2007 年纜車通車，又讓更多遊客能輕鬆上山。"}, en:{t:"From tea farms to teahouses", b:"After the Muzha Tourist Tea Garden opened in 1980, farmers welcomed visitors and hillside teahouse culture grew. The gondola, opened in 2007, brought even more visitors up the mountain."}},
 teaTypes:{type:"fact", zh:{t:"兩種茶", b:"木柵鐵觀音：茶葉捲成球狀或半球狀，焙火較重，茶湯偏琥珀、橙黃，帶熟果與焙火香。文山包種：輕發酵，茶葉是長條捲曲的條索狀，茶湯蜜綠到金黃，帶清新花香。"}, en:{t:"Two teas", b:"Muzha Tieguanyin: leaves rolled into balls or half-balls, more deeply roasted, amber to orange liquor, ripe-fruit and roasted aroma. Wenshan Baozhong: lightly oxidised, long twisted strips, honey-green to golden liquor, fresh floral aroma."}},
 teaLoop:{type:"fact", zh:{t:"茶香環狀步道", b:"這條步道又叫茶香環狀步道，坡度平緩，沿途有小瀑布；出口有兩座貓咪雕像。經過土地公廟，就能接到壺穴步道。"}, en:{t:"The Tea Fragrance Loop", b:"This trail is also called the Tea Fragrance Loop. It is gentle, passes a small waterfall, and has two cat statues at its exit. Past the Earth God shrine it connects to the Pothole Trail."}},
 camphorWood:{type:"fact", zh:{t:"樟樹與樟腦", b:"樟樹木材帶有特殊香氣，可以提煉樟腦。貓空一帶的步道沿途有不少樟樹林，健康步道就有一段可以享受森林浴的樟樹林。"}, en:{t:"Camphor trees", b:"Camphor wood has a distinctive scent and can be distilled into camphor. Many Maokong trails pass camphor woods; the Health Trail has a stretch where you can enjoy a forest bath beneath them."}},
 soil:{type:"fact", zh:{t:"山坡、雨水與石階", b:"健康步道以石階為主，一路往下到溪邊。山坡地遇到大雨容易沖刷土壤，所以步道、排水與植被的維護都很重要——2008 年纜車停駛，正是因為颱風豪雨造成塔柱邊坡土石流失。"}, en:{t:"Slopes, rain and stairs", b:"The Health Trail is mostly stone stairs down to the stream. Heavy rain easily washes away soil on slopes, so trails, drainage and plants all need care — in 2008 the gondola stopped exactly because typhoon rains eroded the slope around a tower."}},
 master:{type:"fiction", zh:{t:"老師傅的筆記（虛構人物，製程為真實）", b:"「葉子剛採下來太硬太脆，要先曬一曬、放一放、輕輕搖動，讓它失去一些水分、變軟。接著用高溫炒，讓發酵停下來。趁熱揉成條，再用布巾包起來反覆揉成球。最後慢慢焙火，香氣才會沉穩。」"}, en:{t:"The master’s notes (fictional person, real process)", b:"“Freshly plucked leaves are too stiff and brittle. First sun them, rest them and toss them gently so they lose water and soften. Then pan-fire them hot to stop oxidation. Roll them while warm, then wrap them in cloth and roll again and again into balls. Finally roast slowly so the aroma settles.”"}},
 center:{type:"fact", zh:{t:"茶研發推廣中心", b:"臺北市鐵觀音包種茶研發推廣中心 1985 年成立，推廣鐵觀音與包種茶，並介紹木柵茶產業與文化的歷史。戶外有茶園、生態池、氣象觀測站，還有一座用人造雨示範水土保持重要性的設施。"}, en:{t:"The Tea Promotion Center", b:"The Taipei Tea Promotion Center for Tieguanyin and Baozhong opened in 1985 to promote both teas and tell the history of Muzha’s tea industry and culture. Outside are a tea garden, an eco-pond, a weather station and an artificial-rain demonstration of why soil conservation matters."}},
 kiln:{type:"fact", zh:{t:"樟樹步道的農村景觀", b:"樟樹步道 2009 年配合貓纜復駛而建，連接貓空與樟山寺，全長約 1.2 公里。沿線土地由地主無償提供，步道旁保存並重現了土角厝、炭窯、水車、穀倉等農村景觀。"}, en:{t:"Village scenes on the Camphor Tree Trail", b:"Built in 2009 for the gondola’s reopening, the trail links Maokong and Zhangshan Temple over about 1.2 km. Local landowners lent the land for free, and village scenes — a mud-brick house, a charcoal kiln, a water wheel and a granary — were kept and recreated along it."}},
 lupine:{type:"fact", zh:{t:"魯冰花", b:"魯冰花常被種在茶園裡當作綠肥，開完花後翻進土裡，可以讓土壤更肥沃。樟樹步道旁的魯冰花大約在 3 月盛開，有黃、藍、白等顏色。"}, en:{t:"Lupines", b:"Lupines are often planted in tea gardens as green manure: after flowering they are ploughed back in to enrich the soil. Beside the Camphor Tree Trail they bloom around March, in yellow, blue and white."}},
 denggao:{type:"fact", zh:{t:"登高步道", b:"登高步道位在明德宮旁，2013 年由臺北市大地工程處鋪設，只有約 200 多公尺，道路兩旁種了櫻花樹，不到 5 分鐘就能走到山頂的望遠亭。"}, en:{t:"The Denggao Trail", b:"Next to Mingde Temple, the trail was paved in 2013 by Taipei’s Geotechnical Engineering Office. It is only about 200 m, lined with young cherry trees, and reaches the lookout pavilion in under five minutes."}},
 basin:{type:"fact", zh:{t:"俯瞰臺北盆地", b:"望遠亭白天可以俯瞰臺北盆地和遠方的山稜，傍晚看夕陽，入夜看城市燈火，也被選為觀賞跨年 101 煙火的熱門地點之一。"}, en:{t:"Over the Taipei Basin", b:"By day the pavilion looks over the Taipei Basin and distant ridges; at dusk, sunsets; at night, city lights. It has been named one of the best places to watch the New Year’s fireworks at Taipei 101."}},
 apricot:{type:"fact", zh:{t:"農場告示：杏花林", b:"杏花林休閒農場由退休茶農張丁頂經營，免費開放參觀。杏花大約在 1 月底到 3 月開，2 月初最美，同時還能看到櫻花和柚子花。"}, en:{t:"Farm notice: the Apricot Grove", b:"The Apricot Blossom farm is run by retired tea farmer Zhang Ding-ding and is free to visit. Apricots bloom from late January to March, best in early February, alongside cherry and pomelo blossoms."}},
 seasons:{type:"fact", zh:{t:"四季觀察筆記", b:"魯冰花：大約 3 月盛開。螢火蟲：4、5 月在壺穴一帶有機會看到。油桐花：5 月可以到指南宮大成殿一帶欣賞。"}, en:{t:"Season notes", b:"Lupines: in full bloom around March. Fireflies: may be seen near the potholes in April and May. Tung blossoms: around Zhinan Temple’s Dacheng Hall in May."}},
 zhanghu:{type:"fact", zh:{t:"「樟湖」這個名字", b:"樟湖步道全長約 2.5 公里，呈半月形，大致與指南路三段平行。日治時期起這裡遍植樟樹，加上低凹像湖的地形，因此得名「樟湖」。"}, en:{t:"The name “Zhanghu”", b:"The Zhanghu Trail is about 2.5 km long, curving like a half-moon roughly parallel to Zhinan Road Sec. 3. Camphor (zhang) has been planted here since the Japanese era, and the land lies low like a lake (hu) — hence “Zhanghu”."}},
 trailheads:{type:"fact", zh:{t:"登山口與音律裝置", b:"樟湖步道東邊的登山口在貓空纜車站旁，叫做「炭窯登山口」；西邊在樟山寺附近。臺北市大地工程處在沿途設置了聆風亭、舌狀鼓座椅、葉形雨盤、沙鈴、祈福編鐘、風之木鈴等音律裝置。"}, en:{t:"Trailheads and sound installations", b:"The trail’s eastern entrance beside the gondola station is called the Charcoal Kiln Trailhead; the western one is near Zhangshan Temple. Taipei’s Geotechnical Engineering Office placed sound installations along the way: a wind pavilion, a tongue-drum bench, leaf rain-plates, rattles, prayer bells and wind chimes."}},
 yinhe:{type:"fact", zh:{t:"銀河洞越嶺步道", b:"貓空越嶺步道又稱銀河洞越嶺步道，翻過山嶺連接新店與貓空，路況大致平緩。銀河洞有一道從山壁直落而下的瀑布。"}, en:{t:"The Yinhe Cave Ridge Trail", b:"Also called the Yinhe Cave Ridge Trail, it crosses the ridge between Xindian and Maokong and is mostly gentle. At Yinhe Cave a waterfall drops straight down the cliff."}},
 porters:DOCS ? DOCS.porters : null
};

/* ---------- Puzzle 3: overlay map ---------- */
function overlaySVG(off, plateUsed, solved) {
  const C = 60, W = OVERLAY.cols*C, H = OVERLAY.rows*C;
  const cx = x => x*C + C/2, cy = y => y*C + C/2;
  const k = ((off.k||0)%4+4)%4;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
  <rect width="${W}" height="${H}" fill="#dcead2"/>
  <path d="M0 ${cy(5)+20} C90 ${cy(4)} 170 ${cy(6)} ${cx(4)} ${cy(5)} S380 ${cy(3)} ${W} ${cy(4)}" stroke="#86c1c6" stroke-width="28" fill="none"/>`;
  for (let i=1;i<OVERLAY.cols;i++) s += `<line x1="${i*C}" y1="0" x2="${i*C}" y2="${H}" stroke="#b9cfb0" stroke-width="1"/>`;
  for (let j=1;j<OVERLAY.rows;j++) s += `<line x1="0" y1="${j*C}" x2="${W}" y2="${j*C}" stroke="#b9cfb0" stroke-width="1"/>`;
  // new-map north arrow (top-right)
  s += `<g transform="translate(${W-34} 40)"><path d="M0 -24 L9 6 L0 0 L-9 6Z" fill="#2f6b45"/><text y="22" font-size="16" font-weight="800" text-anchor="middle" fill="#2f6b45" font-family="Arial">N</text></g>`;
  OVERLAY.marks.forEach(m => { s += `<circle cx="${cx(m.x)}" cy="${cy(m.y)}" r="25" fill="#fffdf3" stroke="#2f6b45" stroke-width="3"/><text x="${cx(m.x)}" y="${cy(m.y)+10}" font-size="28" text-anchor="middle">${m.ico}</text>`; });
  // old map: rotated about the grid centre, then shifted
  s += `<g transform="translate(${off.x*C} ${off.y*C}) rotate(${k*90} ${W/2} ${H/2})" opacity="${plateUsed?.8:.45}">
    <rect x="4" y="4" width="${W-8}" height="${H-8}" fill="#f1dcae" fill-opacity=".22" stroke="#a5743f" stroke-width="4" stroke-dasharray="10 8"/>
    <g transform="translate(${W/2} ${H/2})"><circle r="22" fill="#fff6e0" stroke="#9a4f22" stroke-width="2" opacity=".9"/><path d="M0 -18 L7 4 L0 0 L-7 4Z" fill="#9a4f22"/><text y="17" font-size="11" font-weight="800" text-anchor="middle" fill="#9a4f22" font-family="Arial">N</text></g>`;
  const glyph = (x,y,g) => `<text x="${cx(x)}" y="${cy(y)+14}" font-size="40" font-weight="900" text-anchor="middle" fill="#9a4f22" stroke="#fff6e0" stroke-width="2" paint-order="stroke">${g}</text>`;
  OVERLAY.marks.forEach(m => s += glyph(m.x,m.y,m.glyph));
  OVERLAY.decoys.forEach(d => s += glyph(d.x,d.y,d.glyph));
  if (solved) s += `<text x="${cx(OVERLAY.star.x)}" y="${cy(OVERLAY.star.y)+16}" font-size="44" text-anchor="middle" fill="#c4553a">★</text>`;
  s += `</g></svg>`;
  return s;
}

/* ---------- Puzzle 4: potholes ---------- */
function potholeSVG(seq) {
  const P = POTHOLES.pots;
  let s = `<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <defs><radialGradient id="pw" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#5f8f93"/><stop offset="1" stop-color="#203a3d"/></radialGradient>
  <pattern id="rk" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#a59e90"/><path d="M0 10 Q20 4 40 12 M0 30 Q20 24 40 32" stroke="#958d7f" stroke-width="2" fill="none"/></pattern></defs>
  <rect width="500" height="300" fill="url(#rk)"/>
  <path d="M0 270 C120 250 300 290 500 262 V300 H0Z" fill="#86c1c6" opacity=".75"/>`;
  // draw oldest first so younger potholes physically cut across older rims
  POTHOLES.order.forEach(k => {
    const p = P[k];
    s += `<g class="pot" data-act="pot" data-arg="${k}" data-pot="${k}" role="button" tabindex="0" aria-label="${k}">
      <circle cx="${p.x}" cy="${p.y}" r="${p.r+8}" fill="#8c8577"/>
      <circle class="rim" cx="${p.x}" cy="${p.y}" r="${p.r}" fill="url(#pw)" stroke="#e8e0cc" stroke-width="6"/>
      <circle cx="${p.x}" cy="${p.y}" r="${p.r*0.55}" fill="none" stroke="#3f6a6d" stroke-width="3" opacity=".7"/>
    </g>`;
  });
  // labels on top (not part of the cross-cutting drawing)
  Object.entries(P).forEach(([k,p]) => {
    const n = seq.indexOf(k);
    s += `<g pointer-events="none"><circle cx="${p.x}" cy="${p.y}" r="17" fill="${n>=0?'#e2b45c':'#fffdf3'}" stroke="#213a31" stroke-width="2"/>

  });
  return s + `</svg>`;
}

/* WANDERQUEST v3.0 — game engine. Depends on content.js and art.js. */
(() => {
"use strict";

/* ===================== helpers ===================== */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fill = (str, vars) => String(str).replace(/\{(\w+)\}/g, (_, k) => vars && vars[k] !== undefined ? vars[k] : "{"+k+"}");
const clone = o => JSON.parse(JSON.stringify(o));
const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* storage that never throws (private mode / blocked storage => in-memory) */
const store = (() => {
  let ok = true; const mem = {};
  try { const k="__wq_probe"; window.localStorage.setItem(k,"1"); window.localStorage.removeItem(k); } catch(e){ ok = false; }
  return {
    ok,
    get(k){ try { return ok ? window.localStorage.getItem(k) : (k in mem ? mem[k] : null); } catch(e){ return k in mem ? mem[k] : null; } },
    set(k,v){ mem[k]=v; try { if (ok) window.localStorage.setItem(k,v); } catch(e){ /* quota or blocked */ } },
    del(k){ delete mem[k]; try { if (ok) window.localStorage.removeItem(k); } catch(e){} }
  };
})();

const KEY = "wanderquest-v3-save";
function freshState(){
  return { v:3, lang:null, name:"", nat:"", natOther:"", registered:false, pid:"WQ-"+Math.random().toString(36).slice(2,8).toUpperCase(),
    screen:"lang", scene:"map", flags:{}, bag:[], clues:[], seen:[], hints:{}, tries:{},
    jig:null, logic:Array(16).fill(0), ov:{...OVERLAY.start}, potSeq:[], gateSel:[], st:{}, hIdx:0,
    t0:null, tEnd:null, ev:[] };
}
function loadState(){
  const base = freshState();
  try {
    const raw = store.get(KEY); if (!raw) return base;
    const s = JSON.parse(raw); if (!s || s.v !== 3) return base;
    const m = Object.assign(base, s);
    if (!Array.isArray(m.logic) || m.logic.length !== 16) m.logic = Array(16).fill(0);
    if (m.jig && !(Array.isArray(m.jig.board) && m.jig.board.length===16 && Array.isArray(m.jig.tray) && m.jig.tray.length===2 &&
        [...m.jig.board, ...m.jig.tray].slice().sort((a,b)=>a-b).every((v,i)=>v===i))) m.jig = null;
    ["bag","clues","seen","potSeq","gateSel","ev"].forEach(k => { if (!Array.isArray(m[k])) m[k] = []; });
    if (!m.ov || typeof m.ov.x !== "number" || typeof m.ov.k !== "number") m.ov = {...OVERLAY.start};
    if (!m.st || typeof m.st !== "object") m.st = {};
    if (m.screen === "story") m.screen = "tutorial";   // prologue video removed in v3.1
    if (m.screen === "history") m.hIdx = 0;
    if (m.screen === "profile") m.screen = "register";
    // v4: the sign-up page, history dialog and tutorial are replaced by the opening + enrolment ritual
    if (["register","history","tutorial"].includes(m.screen)) m.screen = m.registered ? "game" : "opening";
    if (m.screen === "game" && m.registered && !m.flags.tutorial && !m.ritDone) m.screen = "ritual";
    if (!m.registered && ["ritual","game"].includes(m.screen)) m.screen = "opening";
    if (m.screen === "game" && !m.flags.tutorial) m.flags.tutorial = true;
    if (!["lang","opening","ritual","game"].includes(m.screen)) m.screen = m.lang ? "game" : "lang";
    if (!m.lang) m.screen = "lang";
    return m;
  } catch(e){ return base; }
}
let S = loadState();
function save(){ store.set(KEY, JSON.stringify(S)); }
function logEv(type, data){ S.ev.push({t:Date.now(), type, data: data ?? ""}); if (S.ev.length > 400) S.ev.splice(0, S.ev.length-400); save(); }

/* ===================== i18n ===================== */
const lang = () => S.lang === "en" ? "en" : "zh";
const t = (k, vars) => { const v = UI[lang()][k]; if (v === undefined) { console.warn("missing UI key", k); return k; } return fill(v, vars); };
const L = (o, vars) => o ? fill(o[lang()] ?? o.zh, vars) : "";
const itemName = id => id === "acorn" ? t("tutAcorn") : L(ITEMS[id]);

/* ===================== puzzle logic (data-driven) ===================== */
function perms(n){ if (n===1) return [[0]]; const out=[]; perms(n-1).forEach(p=>{ for(let i=0;i<=p.length;i++){ const q=p.slice(); q.splice(i,0,n-1); out.push(q);} }); return out; }
function solveLogic(){ // returns every assignment person->thing consistent with ALL clues
  const forb = new Set(); LOGIC.clues.forEach(c => c.forbid.forEach(([p,th]) => forb.add(p+","+th)));
  return perms(LOGIC.people.length).filter(a => a.every((th,p) => !forb.has(p+","+th)));
}
const LOGIC_SOLUTIONS = solveLogic();
if (LOGIC_SOLUTIONS.length !== 1) console.error("Logic puzzle does not have a unique solution!", LOGIC_SOLUTIONS);
const LOGIC_ANSWER = LOGIC_SOLUTIONS[0];   // e.g. [0,1,2,3]: tea master->basket, traveler->map, maintenance->compass, porter->lantern

/* ===================== state helpers ===================== */
const F = k => !!S.flags[k];
const has = id => S.bag.includes(id);
function setFlag(k){ if (!S.flags[k] && (k === "logic" || k === "gate")) timeTick(); if (!S.flags[k]) { S.flags[k] = true; S.flags[k+"At"] = Date.now(); logEv("solved", k); save(); if (k === "logic") placeReported("station"); if (k === "gate") placeReported("valley"); } save(); }
function award(id){ if (!has(id)) { S.bag.push(id); logEv("item", id); toast(t("gotItem",{item:itemName(id)})); save(); } }
function addClue(id){ if (!S.clues.includes(id)) { S.clues.push(id); logEv("clue", id); save(); return true; } return false; }
function markSeen(id){ if (!S.seen.includes(id)) { S.seen.push(id); logEv("inspect", id); save(); } }
function tryCount(k){ S.tries[k] = (S.tries[k]||0) + 1; logEv("attempt", k); save(); }

function objective(){
  if (isGeneric(S.scene)) return placeDone(S.scene) ? t2("stnObjDone") : L(STN[S.scene].obj);
  if (S.scene === "map" && F("gate") || (S.scene === "map" && F("logic") && suggestedNext() && suggestedNext() !== "valley")) { const n = suggestedNext(); return n ? t2("mapNext",{name:nodeName(n)}) : t2("allDoneObj"); }
  if (S.scene === "valley" && F("gate")) { const n = suggestedNext(); return n ? t2("mapNext",{name:nodeName(n)}) : t2("allDoneObj"); }
  if (!F("jig")) return S.scene === "station" ? L(OBJ.jig) : L(OBJ.enterStation);
  if (!F("logic")) return L(OBJ.logic, {n:S.clues.length});
  if (S.scene !== "valley" && !F("plateUsed")) return L(OBJ.toValley);
  if (!F("plateUsed")) return L(OBJ.plate);
  if (!F("overlay")) return L(OBJ.overlay);
  if (!F("pot")) return L(OBJ.pot);
  if (!F("gate")) return L(OBJ.gate);
  return L(OBJ.done);
}
/* The ONE thing the player should tap next (where to go — never the puzzle answer). */
function nextTarget(){
  if (S.scene === "map") { const n = suggestedNext(); return n ? "node-"+n : null; }
  if (isGeneric(S.scene)) { if (placeDone(S.scene)) return "btn-stn-map"; const s = STN[S.scene];
    const unseen = s.hots.find(h => h.doc && !S.seen.includes(S.scene+":"+h.id)); return "hot-" + (unseen ? unseen.id : s.hots.find(h=>h.mech).id); }
  if (S.scene === "station") {
    if (!F("jig")) return "hot-frame";
    if (F("logic")) return "btn-go-valley";
    if (!S.clues.includes("c4")) return "hot-board";
    if (!S.clues.includes("c1") || !S.clues.includes("c2")) return "hot-log";
    if (!S.clues.includes("c3")) return "hot-porter";
    return "hot-cabinet";
  }
  if (S.scene === "valley") {
    if (!F("overlay")) return "hot-oldmap";
    if (!F("pot")) return "hot-potfield";
    if (!F("gate")) return "hot-gate";
  }
  return null;
}
function hintKey(){
  if (isGeneric(S.scene)) return placeDone(S.scene) ? null : "stn";
  if (S.scene === "map" && F("logic")) { const n = suggestedNext(); if (n && n !== "valley") return null; }
  if (!F("jig")) return "jigsaw";
  if (!F("logic")) return "logic";
  if (!F("plateUsed")) return S.scene === "valley" ? "plate" : "toValley";
  if (!F("overlay")) return "overlay";
  if (!F("pot")) return "potholes";
  if (!F("gate")) return "gate";
  return null;
}
function hintList(key){
  if (key === "stn") return STN[S.scene].hints[lang()].slice();
  const base = HINTS[key][lang()].slice();
  if (key === "overlay") { // third level generated from the same data the puzzle uses
    const r = (4 - OVERLAY.start.k % 4) % 4, dx = -OVERLAY.start.x, dy = -OVERLAY.start.y, zh = lang()==="zh";
    const parts = [];
    if (r) parts.push(zh ? `按 ↻ 旋轉 ${r} 次（讓北方箭頭朝上）` : `press ↻ ${r} time(s) (so the north arrow points up)`);
    if (dx) parts.push(zh ? (dx>0?`向右移 ${dx} 格`:`向左移 ${-dx} 格`) : (dx>0?`move ${dx} step(s) right`:`move ${-dx} step(s) left`));
    if (dy) parts.push(zh ? (dy<0?`向上移 ${-dy} 格`:`向下移 ${dy} 格`) : (dy<0?`move ${-dy} step(s) up`:`move ${dy} step(s) down`));
    base.push(zh ? `從起始狀態：${parts.join("，再")}。` : `From the starting position: ${parts.join(", then ")}.`);
  }
  if (key === "potholes") {
    const o = POTHOLES.order;
    base.push(lang()==="zh" ? `${o[0]} 最老；${o[1]} 切過 ${o[0]}；${o[2]} 切過 ${o[1]}；${o[3]} 切過 ${o[2]}。順序是 ${o.join(" → ")}。`
                            : `${o[0]} is oldest; ${o[1]} cuts ${o[0]}; ${o[2]} cuts ${o[1]}; ${o[3]} cuts ${o[2]}. The order is ${o.join(" → ")}.`);
  }
  return base;
}

/* Prologue timing: each line stays up for as long as it takes to READ it (or, with voice on,
   until the voice has finished speaking it), then a short breathing pause. No fixed time slots. */
const GAP = 0.7;                                   // pause after a line, seconds
function readDur(text){
  const cjk = (text.match(/[\u3400-\u9fff]/g) || []).length;
  const words = text.replace(/[\u3400-\u9fff]/g, "").split(/\s+/).filter(Boolean).length;
  const s = lang() === "zh" ? 1.0 + cjk * 0.19 : 1.0 + words * 0.33;
  return Math.max(3.0, Math.min(7.5, s));
}
let SL = null;   // {idx, el (seconds into line), voiceDone, voiceAt}
function storyTotal(){ return STORY.reduce((a,s)=>a+readDur(s[lang()])+GAP,0); }
function startStory(){
  stopStory(); storyPaused = false;
  SL = {idx:0, el:0, voiceDone:false, voiceAt:0, done:false};
  showLine();
  let prev = performance.now();
  storyTimer = setInterval(() => {
    const now = performance.now(), dt = Math.min(0.5, (now - prev)/1000); prev = now;
    if (storyPaused || !SL || SL.done) return;
    SL.el += dt;
    const text = STORY[SL.idx][lang()], est = readDur(text);
    let finished;
    if (voice && "speechSynthesis" in window) finished = (SL.voiceDone && SL.el >= SL.voiceAt + GAP && SL.el >= 1.5) || SL.el >= est*2.2 + 2;
    else finished = SL.el >= est + GAP;
    if (finished) {
      if (SL.idx < STORY.length - 1) { SL.idx++; SL.el = 0; SL.voiceDone = false; showLine(); }
      else { SL.done = true; const e = document.getElementById("story-end"); if (e) e.classList.remove("hidden"); }
    }
    updateBar();
  }, 100);
}
function showLine(){
  const film = document.getElementById("film"); if (!film || !SL) return;
  film.className = "film s" + SL.idx;
  const line = STORY[SL.idx][lang()];
  document.getElementById("subtitle").textContent = line;
  speak(line);
  updateBar();
}
function updateBar(){
  const fillEl = document.getElementById("timefill"); if (!fillEl || !SL) return;
  let before = 0; for (let i=0;i<SL.idx;i++) before += readDur(STORY[i][lang()]) + GAP;
  const cur = readDur(STORY[SL.idx][lang()]) + GAP;
  const pct = SL.done ? 100 : (before + Math.min(SL.el, cur)) / storyTotal() * 100;
  fillEl.style.width = pct + "%";
}
function pickVoice(){
  const vs = window.speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().replace("_","-").startsWith(lang()==="zh" ? "zh" : "en"));
  const pref = lang()==="zh" ? vs.filter(v => /tw|hant/i.test(v.lang)) : vs.filter(v => /us|gb/i.test(v.lang));
  const pool = pref.length ? pref : vs;
  return pool.find(v => /female|mei-?jia|hsiao|hanhan|xiaoxiao|samantha|jenny|aria|zira|serena|karen|google/i.test(v.name)) || pool[0] || null;
}
function speak(text){
  if (!voice || !("speechSynthesis" in window)) return;
  const myLine = SL ? SL.idx : -1;
  const go = () => {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = lang()==="zh" ? "zh-TW" : "en-US"; u.rate = 0.95; u.pitch = 1.1;
      const v = pickVoice(); if (v) u.voice = v;
      const finish = () => { if (SL && SL.idx === myLine && !SL.voiceDone) { SL.voiceDone = true; SL.voiceAt = SL.el; } };
      u.onend = finish; u.onerror = finish;
      window.speechSynthesis.speak(u);
    } catch(e){ if (SL) { SL.voiceDone = true; SL.voiceAt = SL.el; } }
  };
  if (window.speechSynthesis.getVoices().length) go();
  else { let fired = false; const once = () => { if (fired) return; fired = true; go(); };
         window.speechSynthesis.addEventListener("voiceschanged", once, {once:true}); setTimeout(once, 600); }
}
function stopStory(){ if (storyTimer) { clearInterval(storyTimer); storyTimer = null; } try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){} }

/* ===================== puzzle actions ===================== */
function newJigsaw(){
  let ids;
  do { ids = shuffle([...Array(18).keys()]); } while (ids.slice(0,16).every((v,i)=>v===i));
  S.jig = {board: ids.slice(0,16), tray: ids.slice(16), swaps:0}; save();
}
function jigTap(where, i){
  if (F("jig")) return;
  if (!SEL) { SEL = {where, i}; renderModal(); return; }
  if (SEL.where === where && SEL.i === i) { SEL = null; renderModal(); return; }
  const A = S.jig[SEL.where], B = S.jig[where];
  [A[SEL.i], B[i]] = [B[i], A[SEL.i]];
  S.jig.swaps = (S.jig.swaps||0) + 1; SEL = null; M.fb = null; save(); renderModal();
}
function jigCheck(){
  const J = S.jig;
  const correct = J.board.every((p,i) => p === i);   // tiles are visually unique => position i must hold piece i
  if (correct) { setFlag("jig"); award("pic"); setFb("ok", () => t("jigOk")); renderModal(); return; }
  tryCount("jigsaw");
  if (J.tray.some(p => p < 16)) setFb("bad", () => t("jigTrayWrong"));
  else setFb("bad", () => t("jigWrong", {n: J.board.filter((p,i)=>p!==i).length}));
  renderModal();
}
function logicCheck(){
  const g = S.logic, P = LOGIC.people.length, T = LOGIC.things.length;
  for (let p=0;p<P;p++){ const n = g.slice(p*T,p*T+T).filter(v=>v===2).length; if (n !== 1){ tryCount("logic"); const row=p+1; setFb("bad", () => t("logicNeedRow",{row, n})); return renderModal(); } }
  for (let th=0;th<T;th++){ let n=0; for(let p=0;p<P;p++) if (g[p*T+th]===2) n++; if (n>1){ tryCount("logic"); setFb("bad", () => t("logicDupCol",{item:L(LOGIC.things[th])})); return renderModal(); } }
  const assign = []; for (let p=0;p<P;p++) assign.push(g.slice(p*T,p*T+T).indexOf(2));
  if (assign.every((th,p) => th === LOGIC_ANSWER[p])) {
    setFlag("logic"); award("plate"); setFb("ok", () => t("logicOk") + " " + L(MISC.cabinetGot)); renderModal(); return;
  }
  tryCount("logic");
  for (let p=0;p<P;p++){ const th = assign[p];
    const c = LOGIC.clues.find(c => c.forbid.some(([a,b]) => a===p && b===th));
    if (c) { if (S.clues.includes(c.id)) setFb("bad", () => t("logicContradict",{person:L(LOGIC.people[p]), item:L(LOGIC.things[th]), clue:L(c)}));
             else setFb("bad", () => L(MISC.logicHidden));
             return renderModal(); } }
  setFb("bad", () => t("wrongTry")); renderModal();
}
/* where an old-map cell lands on the new map for the current rotation k and offset */
function ovPlace(p, ov){
  const c = (OVERLAY.cols-1)/2, k = ((ov.k%4)+4)%4; let dx = p.x - c, dy = p.y - c;
  for (let i=0;i<k;i++) [dx,dy] = [-dy, dx];            // 90° clockwise in screen coordinates
  return {x: Math.round(dx + c + ov.x), y: Math.round(dy + c + ov.y)};
}
function ovCount(ov){
  const glyphs = [...OVERLAY.marks.map(m=>({x:m.x,y:m.y,k:m.k})), ...OVERLAY.decoys.map(d=>({x:d.x,y:d.y,k:"decoy"}))].map(g=>({...ovPlace(g,ov), k:g.k}));
  const right = OVERLAY.marks.filter(m => glyphs.some(g => g.x===m.x && g.y===m.y && g.k===m.k)).length;
  const wrong = OVERLAY.marks.filter(m => glyphs.some(g => g.x===m.x && g.y===m.y && g.k!==m.k)).length;
  return {right, wrong};
}
function ovCheck(){
  const {right, wrong} = ovCount(S.ov);
  if (right === 3) { setFlag("overlay"); setFb("ok", () => t("ovOk")); renderModal(); return; }
  tryCount("overlay");
  setFb("bad", () => t("ovWrong",{n:right}) + (wrong ? " " + L(MISC.ovWrongSym,{k:wrong}) : ""));
  renderModal();
}
function potCheck(){
  const seq = S.potSeq, ord = POTHOLES.order;
  if (seq.length === 4 && seq.every((k,i) => k === ord[i])) { setFlag("pot"); award("rubbing"); setFb("ok", () => t("potOk")); renderModal(); return; }
  tryCount("potholes");
  for (let i=0;i<seq.length;i++) for (let j=i+1;j<seq.length;j++) {
    if (ord.indexOf(seq[i]) > ord.indexOf(seq[j])) {   // seq[i] is actually younger than seq[j]
      const a = seq[i], b = seq[j];
      const touch = POTHOLES.cuts.some(([y,o]) => (y===a&&o===b)||(y===b&&o===a));
      setFb("bad", () => t(touch ? "potWrongPair" : "potWrongFar", {a, b})); return renderModal();
    }
  }
  setFb("bad", () => t("wrongTry")); renderModal();
}
function gateGo(){
  const sel = S.gateSel;
  if (sel.length !== 2) { tryCount("gate"); setFb("bad", () => t("gateNeedTwo",{n:sel.length})); return renderModal(); }
  const bad = sel.find(id => !["plate","rubbing"].includes(id));
  if (bad) { tryCount("gate"); setFb("bad", () => t("gateWrong",{item:itemName(bad)})); return renderModal(); }
  setFlag("gate"); award("core"); save();
  toast(t("gateOk"));
  if (ORDER_ALL.every(placeDone)) { S.tEnd = Date.now(); save(); M = {type:"ending", fb:null}; }
  else M = {type:"info", arg:{title:{zh:UI.zh.gateTitle,en:UI.en.gateTitle}, text:{zh:UI2.zh.valleyDone,en:UI2.en.valleyDone}, action:{act:"goMap", arg:"", label:{zh:UI2.zh.goMapBtn,en:UI2.en.goMapBtn}}}, fb:null};
  root.innerHTML = gameScreen(); renderModal();
}

function hot(id){
  const scene = S.scene; if (isGeneric(scene)) return genericHot(scene, id);
  markSeen(scene+":"+id);
  if (scene === "station") {

const t2 = (k, vars) => { const v = UI2[lang()][k]; if (v === undefined) { console.warn("missing UI2 key", k); return k; } return fill(v, vars); };

const MECH = {};

/* spot the difference (A2) */
MECH.spot = {

  },

ACT.spotClick = (id, el, ev) => {
  if (placeDone(id)) return;

  const S0 = st(id); S0.found = S0.found || [];
  const hit = MECHDATA[id].targets.findIndex((g,i) => !S0.found.includes(i) && Math.hypot(g.x-x, g.y-y) <= g.r);
  if (hit < 0) { const already = MECHDATA[id].targets.some(g => Math.hypot(g.x-x,g.y-y) <= g.r); if (!already) mechFail(id, () => t2("spotMiss")); return; }
  S0.found.push(hit); save(); M.fb = null;
  if (S0.found.length === MECHDATA[id].targets.length) return mechSolved(id);

};

/* sorting (A4) */
MECH.sort = {

  },
  controls(id){ return ctl(id, `<button class="btn-primary" data-act="sortCheck" data-arg="${id}" id="btn-mech-check">${esc(t2("stnCheck"))}</button>`); }
};

ACT.sortCheck = id => { const D = MECHDATA[id], a = st(id).a || D.samples.map(()=>-1);
  const unset = a.filter(v=>v<0).length; if (unset) return mechFail(id, () => t2("sortUnset",{n:unset}));
  const wrong = D.samples.filter((s,i)=>s.ans!==a[i]).length; if (wrong) return mechFail(id, () => t2("sortWrong",{n:wrong}));
  mechSolved(id); };

/* pipes (A5) */
const DIRV = {t:[-1,0,"b"], b:[1,0,"t"], l:[0,-1,"r"], r:[0,1,"l"]};
function pipesInit(id){ const D = MECHDATA[id], S0 = st(id);
  if (!S0.rot) { do { S0.rot = D.tiles.map(row => row.map(() => Math.floor(Math.random()*4))); } while (pipesFlow(id, S0.rot).done); save(); }
  return S0.rot; }
function pipesFlow(id, rot){
  const D = MECHDATA[id], n = D.size, wet = new Set(); let done = false;
  const opens = (r,c) => ART2.OPEN[D.tiles[r][c]][rot[r][c]%4];
  if (!opens(0,0).includes("t")) return {wet, done};
  const q = [[0,0]]; wet.add("0,0");
  while (q.length) { const [r,c] = q.shift();
    for (const d of opens(r,c)) { if (r===n-1 && c===n-1 && d==="b") done = true;
      const [dr,dc,back] = DIRV[d], nr = r+dr, nc = c+dc;
      if (nr<0||nc<0||nr>=n||nc>=n) continue;
      if (!opens(nr,nc).includes(back)) continue;
      const k = nr+","+nc; if (!wet.has(k)) { wet.add(k); q.push([nr,nc]); } } }
  return {wet, done};
}
MECH.pipes = {
  render(id, done){

/* process order (A6) */
MECH.process = {
  render(id, done){
    const D = MECHDATA[id], S0 = st(id);

      ${done ? "" : `<h3>${esc(t2("procTray"))}</h3><div class="choices">${S0.tray.filter(sid=>!order.includes(sid)).map(sid=>`<button data-act="procPick" data-arg="${id}:${sid}" id="proc-${sid}">${esc(L(step(sid)))}</button>`).join("")}</div>`}`;

};
ACT.procPick = a => { const [id,sid] = a.split(":"); const S0 = st(id); S0.order = S0.order || []; if (!S0.order.includes(sid)) S0.order.push(sid); M.fb = null; save(); renderModal(); };

ACT.procCheck = id => { const D = MECHDATA[id], order = st(id).order || [], right = D.steps.map(s=>s.id);
  const i = right.findIndex((sid,k) => order[k] !== sid);
  if (i < 0) return mechSolved(id);
  const placed = order[i], why = D.why[placed];
  // the step placed at i belongs later => explain why it can't happen yet

/* logic grid (B2, B4) — solution computed from clues, like puzzle 2 */
function gridSolve(G){ const forb = new Set(); G.clues.forEach(c=>c.forbid.forEach(([p,th])=>forb.add(p+","+th)));
  return perms(G.people.length).filter(a => a.every((th,p)=>!forb.has(p+","+th))); }

    const rows = G.people.map((p,pi)=>`<tr><th scope="row">${esc(L(p))}</th>${G.things.map((th,ti)=>{const v=g[pi*n+ti];
      return `<td><button class="m${v}" data-act="gridCell" data-arg="${id}:${pi*n+ti}" id="g-${pi}-${ti}" ${done?"disabled":""} aria-label="${esc(L(p))} / ${esc(L(th))}">${["","✕","✓"][v]}</button></td>`}).join("")}</tr>`).join("");
    return `<div class="logic-wrap"><div><table class="logic"><thead><tr><th></th>${G.things.map(th=>`<th>${esc(L(th))}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>

};
ACT.gridCell = a => { const [id,i] = a.split(":"); const G = MECHDATA[id].grid, n = G.people.length, S0 = st(id); S0.g = S0.g || Array(n*n).fill(0); S0.g[+i] = (S0.g[+i]+1)%3; M.fb = null; save(); renderModal(); };
ACT.gridReset = id => { st(id).g = null; M.fb = null; save(); renderModal(); };
ACT.gridCheck = id => { const G = MECHDATA[id].grid, n = G.people.length, g = st(id).g || Array(n*n).fill(0);
  const as = []; for (let p=0;p<n;p++){ const row = g.slice(p*n,p*n+n); if (row.filter(v=>v===2).length !== 1) return mechFail(id, () => t2("gridWrongRow")); as.push(row.indexOf(2)); }
  if (new Set(as).size !== n) return mechFail(id, () => t2("gridDup"));
  if (as.every((th,p)=>th===G.answer[p])) return mechSolved(id);
  const c = G.clues.find(c => c.forbid.some(([p,th]) => as[p]===th));
  mechFail(id, () => c ? t2("gridContra",{clue:L(c)}) : t("wrongTry")); };

/* 9-piece jigsaw with 2 decoys (B3) */
function jig9Init(id){ const S0 = st(id); if (!S0.board) { let ids; do { ids = shuffle([...Array(11).keys()]); } while (ids.slice(0,9).every((v,i)=>v===i)); S0.board = ids.slice(0,9); S0.tray = ids.slice(9); save(); } return S0; }
function jig9Tile(id, piece, where, i){
  const sel = SEL && SEL.id === id && SEL.where === where && SEL.i === i;
  const style = piece >= 9 ? `background-image:url("${ART2.DAY_URI[piece-9]}");background-size:100% 100%` : `background-image:url("${ART2.NIGHT_URI}");background-size:300% 300%;background-position:${(piece%3)*50}% ${Math.floor(piece/3)*50}%`;
  return `<button class="tile${sel?" sel":""}" style='${style}' data-act="j9Tap" data-arg="${id}:${where}:${i}" data-piece="${piece}" aria-label="${where} ${i+1}"></button>`;
}
MECH.jig9 = {
  render(id, done){
    const S0 = done && !st(id).board ? {board:[0,1,2,3,4,5,6,7,8], tray:[9,10]} : jig9Init(id);
    return `<div class="jig"><div><div class="board" style="grid-template-columns:repeat(3,1fr);max-width:360px" id="j9-board">${S0.board.map((p,i)=>jig9Tile(id,p,"board",i)).join("")}</div></div>
      <div>${done?"":`<div class="tray-label">${esc(t2("jig9Tray"))}</div><div class="tray" id="j9-tray">${S0.tray.map((p,i)=>jig9Tile(id,p,"tray",i)).join("")}</div>`}</div></div>`;
  },
  controls(id){ return ctl(id, `<button class="btn-primary" data-act="j9Check" data-arg="${id}" id="btn-mech-check">${esc(t2("stnCheck"))}</button><button data-act="j9Reset" data-arg="${id}">${esc(t2("stnReset"))}</button>`); }
};
ACT.j9Tap = a => { const [id,where,i] = a.split(":"); if (placeDone(id)) return; const S0 = jig9Init(id);
  if (!SEL || SEL.id !== id) { SEL = {id, where, i:+i}; return renderModal(); }
  if (SEL.where === where && SEL.i === +i) { SEL = null; return renderModal(); }
  const A = S0[SEL.where], B = S0[where]; [A[SEL.i], B[+i]] = [B[+i], A[SEL.i]]; SEL = null; M.fb = null; save(); renderModal(); };
ACT.j9Reset = id => { const S0 = st(id); S0.board = null; jig9Init(id); SEL = null; M.fb = null; renderModal(); };
ACT.j9Check = id => { const S0 = jig9Init(id);
  if (S0.board.every((p,i)=>p===i)) return mechSolved(id);
  if (S0.tray.some(p=>p<9)) return mechFail(id, () => t2("jig9Tray2"));
  mechFail(id, () => t2("jig9Wrong",{n:S0.board.filter((p,i)=>p!==i).length})); };

/* sound memory (B5) */
let AC = null, SIMON_PLAYING = false;
function tone(f){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain();
  o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.25, AC.currentTime+0.03); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+0.45);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+0.5); } catch(e){} }
function simonFlash(i){ const el = document.getElementById("simon-"+i); if (el) { el.classList.add("lit"); setTimeout(()=>el.classList.remove("lit"), 420); } tone(MECHDATA.b5.instruments[i].f); }
MECH.simon = {
  render(id, done){
    const D = MECHDATA[id], S0 = st(id), round = S0.round || 0;
    const status = done ? "" : SIMON_PLAYING ? t2("simonWatch") : S0.seq ? t2("simonYour") : "";
    return `<p class="small" style="text-align:center"><b>${done?"":esc(t2("simonRound",{r:round+1, n:D.rounds[Math.min(round,2)]}))}</b> ${esc(status)}</p>

      <p class="small muted" style="text-align:center">${(S0.input||[]).length ? "●".repeat(S0.input.length) : ""}</p>`;
  },
  controls(id){ const S0 = st(id); return ctl(id, `<button class="btn-gold" data-act="simonListen" data-arg="${id}" id="btn-simon-listen">${esc(S0.seq ? t2("simonAgain") : t2("simonListen"))}</button>`); }
};
ACT.simonListen = id => { if (SIMON_PLAYING) return; const D = MECHDATA[id], S0 = st(id), round = S0.round || 0;
  if (!S0.seq) { S0.seq = Array.from({length:D.rounds[round]}, () => Math.floor(Math.random()*D.instruments.length)); }
  S0.input = []; save(); SIMON_PLAYING = true; M.fb = null; renderModal(); logEv("simon_listen", round);
  S0.seq.forEach((n,k) => setTimeout(() => simonFlash(n), 700 + k*750));
  setTimeout(() => { SIMON_PLAYING = false; if (M && M.type === "mech") renderModal(); }, 700 + S0.seq.length*750 + 200); };
ACT.simonTap = a => { const [id,i] = a.split(":"); if (SIMON_PLAYING || placeDone(id)) return; const D = MECHDATA[id], S0 = st(id);
  simonFlash(+i); if (!S0.seq) return;
  S0.input = S0.input || []; S0.input.push(+i);
  const k = S0.input.length - 1;
  if (S0.seq[k] !== +i) { S0.input = []; save(); return mechFail(id, () => t2("simonWrong")); }
  if (S0.input.length === S0.seq.length) { S0.round = (S0.round||0) + 1; S0.seq = null; S0.input = []; save();
    if (S0.round >= D.rounds.length) return mechSolved(id);
    setFb("ok", () => t2("simonGood")); return renderModal(); }
  save(); M.fb = null; renderModal(); };

/* route planning (B6) */
MECH.path = {
  render(id, done){
    const D = MECHDATA[id], S0 = st(id); const path = S0.path || [D.start];
    const on = (r,c) => path.findIndex(p=>p[0]===r&&p[1]===c);
    let cells = "";
    D.h.forEach((row,r) => row.forEach((hv,c) => {
      const k = on(r,c), cliff = hv < 0, isS = r===D.start[0]&&c===D.start[1], isG = r===D.goal[0]&&c===D.goal[1], isW = r===D.water[0]&&c===D.water[1];
      const shade = cliff ? "#5a4a46" : ["#e9f3dc","#d4e8c4","#bcdcab","#a3cd92","#8ab97b","#73a566"][hv];
      cells += `<button class="tile" style="background:${shade};${k>=0?"outline:4px solid #c4553a;outline-offset:-4px;":""}font-weight:800;color:${cliff?"#fff":"#213a31"}" data-act="pathTap" data-arg="${id}:${r}:${c}" id="path-${r}-${c}" ${done?"disabled":""}>
        <span style="font-size:13px">${cliff?"⛔":isS?"🚩":isG?"🏁":isW?"💦":""}</span><br>${cliff?"":hv}${k>0?`<sup style="color:#c4553a">${k}</sup>`:""}</button>`;
    }));
    return `<div class="board" style="grid-template-columns:repeat(6,1fr);max-width:420px" id="path-board">${cells}</div>
      <p class="small" style="text-align:center">${esc(t2("pathLen",{n:path.length-1}))}</p>`;
  },
  controls(id){ return ctl(id, `<button data-act="pathUndo" data-arg="${id}">${esc(t2("pathUndo"))}</button><button data-act="pathReset" data-arg="${id}">${esc(t2("stnReset"))}</button><button class="btn-primary" data-act="pathCheck" data-arg="${id}" id="btn-mech-check">${esc(t2("stnCheck"))}</button>`); }
};
ACT.pathTap = a => { const [id,r,c] = a.split(":").map((v,i)=>i?+v:v); if (placeDone(id)) return; const D = MECHDATA[id], S0 = st(id);
  S0.path = S0.path || [D.start]; const last = S0.path[S0.path.length-1];
  if (last[0]===r && last[1]===c) return;
  const prevIdx = S0.path.findIndex(p=>p[0]===r&&p[1]===c);
  if (prevIdx >= 0 && prevIdx === S0.path.length-2) { S0.path.pop(); save(); M.fb = null; return renderModal(); }   // tap previous square = step back
  const hv = D.h[r][c], hl = D.h[last[0]][last[1]];
  let why = null;
  if (Math.abs(last[0]-r) + Math.abs(last[1]-c) !== 1) why = t2("pathNotAdj");
  else if (hv < 0) why = t2("pathCliff");
  else if (prevIdx >= 0) why = t2("pathVisited");
  else if (Math.abs(hv-hl) > 1) why = t2("pathSteep",{a:hl, b:hv});
  if (why) { const w = why; return mechFail(id, () => t2("pathWrongStep",{why:w})); }
  S0.path.push([r,c]); save(); M.fb = null;
  if (r===D.goal[0] && c===D.goal[1]) return ACT.pathCheck(id);
  renderModal(); };
ACT.pathUndo = id => { const S0 = st(id); if (S0.path && S0.path.length > 1) S0.path.pop(); M.fb = null; save(); renderModal(); };
ACT.pathReset = id => { st(id).path = null; M.fb = null; save(); renderModal(); };
ACT.pathCheck = id => { const D = MECHDATA[id], path = st(id).path || [D.start], last = path[path.length-1];
  if (!(last[0]===D.goal[0] && last[1]===D.goal[1])) return mechFail(id, () => t2("pathNeedGoal"));
  if (!path.some(p=>p[0]===D.water[0]&&p[1]===D.water[1])) return mechFail(id, () => t2("pathNeedWater"));
  mechSolved(id); };

    lang:S.lang, registeredAt:S.registeredAt || null, done, doneCount:Object.keys(done).length, current:S.scene,
    routeA:ROUTE_A.every(placeDone), routeB:ROUTE_B.every(placeDone), finishedAt: ORDER_ALL.every(placeDone) ? (S.tEnd || Date.now()) : null,
    minutes: S.t0 ? Math.round(((S.tEnd || Date.now()) - S.t0)/60000) : 0, hints:totalHints(), tries:totalTries(),
    seconds: Object.fromEntries(ORDER_ALL.map(id => [id, Math.round(((S.time||{})[id]||0)/1000)])),
    activeMinutes: Math.round(Object.values(S.time||{}).reduce((a,b)=>a+b,0)/6000)/10, event:ev };
}
function report(type, place, detail){
  if (!SHEET_ENDPOINT || !S.registered) return;
  if (!Array.isArray(S.outbox)) S.outbox = [];
  S.outbox.push(snapshot({type, place: place || "", detail: detail === undefined ? "" : String(detail), t: Date.now()}));
  if (S.outbox.length > 60) S.outbox.splice(0, S.outbox.length - 60);
  save(); flushOutbox();
}
let FLUSHING = false;
async function flushOutbox(){
  if (FLUSHING || !SHEET_ENDPOINT || !Array.isArray(S.outbox) || !S.outbox.length || typeof fetch !== "function") return;
  FLUSHING = true;
  try {
    while (S.outbox.length) {
      const item = S.outbox[0];
      // text/plain + no-cors avoids a CORS preflight, which Apps Script does not answer
      await fetch(SHEET_ENDPOINT, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(item), keepalive:true});
      S.outbox.shift(); save();
    }
  } catch(e){ /* offline: keep the rows and retry next time */ }
  FLUSHING = false;
}

  if (!S.reported.B && ROUTE_B.every(placeDone)) { S.reported.B = true; report("route_done", "", "B"); }
  if (!S.reported.all && ORDER_ALL.every(placeDone)) { S.reported.all = true; report("game_done", "", playMinutes()+" min"); }
}

function timeTick(force){
  const now = Date.now(), dt = now - TICK_LAST; TICK_LAST = now;
  if (!force && typeof document !== "undefined" && document.visibilityState === "hidden") return;
  if (dt <= 0 || dt > 90000) return;                       // device asleep / long gap: don't count

/* ---------- sound: everything synthesized with WebAudio (no files) ---------- */
const SND = (() => {
  let ac = null, master = null, amb = null, timer = null, on = true, level = 0;
  const ok = () => !!ac;
  function init(){
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = on ? 1 : 0; master.connect(ac.destination); } catch(e){ ac = null; } }
    if (ac && ac.state === "suspended") ac.resume().catch(()=>{});
    return ok();
  }
  function noise(sec){ const b = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate*sec)), ac.sampleRate), d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; return b; }
  function env(g, t, a, peak, d){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t+a); g.gain.exponentialRampToValueAtTime(0.0001, t+a+d); }
  /* ambience = water on the boil + charcoal crackle; level 0..1 */
  function ambience(lv){
    if (!init()) return; level = lv;
    if (!amb) {
      amb = ac.createGain(); amb.gain.value = 0.0001; amb.connect(master);
      const src = ac.createBufferSource(); src.buffer = noise(2); src.loop = true;
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420;
      const g = ac.createGain(); g.gain.value = 0.10; src.connect(lp); lp.connect(g); g.connect(amb); src.start();
      let nextPop = 0, nextCrk = 0;
      timer = setInterval(() => {
        if (!amb || level <= 0) return; const t = ac.currentTime;
        if (t >= nextPop) {                               // bubbles
          const o = ac.createOscillator(), gg = ac.createGain(); o.type = "sine"; const f = 260 + Math.random()*420;
          o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f*1.9, t+0.05);
          env(gg, t, 0.006, 0.05 + Math.random()*0.05, 0.06); o.connect(gg); gg.connect(amb); o.start(t); o.stop(t+0.1);
          nextPop = t + 0.05 + Math.random()*0.22;
        }
        if (t >= nextCrk) {                               // charcoal crackle
          const s = ac.createBufferSource(); s.buffer = noise(0.03); const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1400 + Math.random()*2400;
          const gg = ac.createGain(); env(gg, t, 0.002, 0.08 + Math.random()*(Math.random() < .15 ? .55 : .2), 0.02 + Math.random()*0.04);
          s.connect(hp); hp.connect(gg); gg.connect(amb); s.start(t);
          nextCrk = t + (Math.random() < .3 ? 0.03 + Math.random()*0.06 : 0.12 + Math.random()*0.45);
        }
      }, 30);
    }
    amb.gain.cancelScheduledValues(ac.currentTime); amb.gain.setTargetAtTime(Math.max(0.0001, lv), ac.currentTime, 0.6);
  }
  function stop(){ if (!amb) return; const a = amb, tm = timer; amb = null; timer = null; level = 0;
    try { a.gain.setTargetAtTime(0.0001, ac.currentTime, 0.4); } catch(e){} setTimeout(() => { clearInterval(tm); try { a.disconnect(); } catch(e){} }, 1600); }
  function tone(freq, dur, peak = 0.18, type = "sine", when = 0){
    if (!init()) return; const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq; env(g, t, 0.01, peak, dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    init, ambience, stop,
    bell(){ tone(1318, 1.6, .16); tone(1975, 1.2, .08); tone(2637, .8, .04); },
    pop(){ tone(660, .18, .12, "triangle"); tone(990, .22, .08, "sine", .06); },
    chime(i = 0){ const s = [523, 659, 784, 1047, 1319]; tone(s[i % s.length], .5, .14, "triangle"); },
    yes(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, .5, .12, "triangle", i*.09)); },
    thump(){ tone(96, .35, .4, "sine"); tone(180, .12, .12, "triangle"); },
    tick(){ tone(1200, .04, .05, "square"); },
    get on(){ return on; },
    toggle(){ on = !on; if (master) master.gain.value = on ? 1 : 0; return on; }
  };
})();

/* ---------- typewriter for the bottom dialogue box ---------- */
let TW = null;
function typeLine(el, text, done){
  if (TW) clearInterval(TW.iv); TW = null;
  if (!el) return;
  if (REDUCED) { el.textContent = text; done && done(); return; }
  const chars = [...text]; let i = 0; el.textContent = "";
  TW = { iv: setInterval(() => { i++; el.textContent = chars.slice(0, i).join(""); if (i % 3 === 0) SND.tick();
    if (i >= chars.length) { clearInterval(TW.iv); TW = null; done && done(); } }, 34), finish(){ clearInterval(this.iv); TW = null; el.textContent = text; done && done(); } };
}

function seekerType(){

  const best = Object.keys(n).filter(k => n[k] === Math.max(...Object.values(n)));
  return best.length === 1 ? best[0] : (a[2] || "scent");          // a 1-1-1 tie goes to the last (fog) question

}
function ritualScreen(){
  const step = RIT.includes(S.ritStep) ? S.ritStep : "intro";

  if (step === "intro" || /^q\d$/.test(step)) {

    body = `${ritAmo(L(OPEN.quizIntro), qi === 0 ? "surprised" : "neutral")}
      <div class="rit-card"><div class="rit-kicker">👁️ ${esc(OT("quizKicker"))} · ${esc(OT("quizN",{n:qi+1}))}</div>
        <div class="rit-dots">${[0,1,2].map(k=>`<i class="${k<qi?"done":k===qi?"on":""}"></i>`).join("")}</div>

        <div class="rit-opts">${q.opts.map(o => `<button class="rit-opt" data-act="ritPick" data-arg="${qi}:${o.k}" id="quiz-${qi}-${o.k}"><span class="ico">${o.ico}</span><span>${esc(L(o))}</span></button>`).join("")}</div></div>`;
  } else if (step === "result") {
    const ty = OPEN.types[seekerType()];
    body = `${ritAmo(L(ty.line), "happy")}
      <div class="rit-card center"><div class="rit-kicker">${esc(OT("resultKicker"))}</div>
        <div class="rit-type"><span class="big">${ty.ico}</span><h2>${esc(L(ty))}</h2></div>
        <p class="rit-route">🧭 ${esc(OT("routeFirst",{route:L(OPEN.routes[ty.route])}))}</p>
        <button class="btn-gold" data-act="ritGo" data-arg="contract" id="rit-next">${esc(OT("next"))} →</button></div>`;
  } else if (step === "contract") {
    body = `${ritAmo(S.signed ? L(OPEN.signed) : OT("signAmo"), S.signed ? "happy" : "worried")}
      <div class="rit-card center contract ${S.signed ? "signed" : ""}"><div class="rit-kicker">✍️ ${esc(OT("contractTitle"))}</div>
        <p class="rit-promise">${esc(OT("contractText"))}</p>
        <p class="rit-sign">${esc(OT("signAs"))} <b>${esc(S.name)}</b></p>
        <button class="thumb-pad" id="thumb-pad" aria-label="${esc(OT("hold"))}" ${S.signed ? "disabled" : ""}>
          <svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" class="track"/><circle cx="60" cy="60" r="54" class="prog" id="thumb-prog"/></svg>
          <span class="print">${OART.PROPS.thumb}</span></button>
        <p class="rit-hold" id="thumb-msg">${esc(S.signed ? OT("holdDone") : OT("hold"))}</p>
        ${S.signed ? `<button class="btn-gold" data-act="ritGo" data-arg="pack" id="rit-next">${esc(OT("next"))} →</button>` : ""}</div>`;
  } else if (step === "pack") {
    const n = S.packN || 0, cur = OPEN.pack[Math.max(0, n-1)];
    body = `${ritAmo(OT(n ? "packAmo1" : "packAmo0"), n >= OPEN.pack.length ? "happy" : "surprised")}
      <div class="rit-card center"><div class="rit-kicker">🎒 ${esc(OT("packTitle"))}</div><p class="muted-l">${esc(OT("packSub"))}</p>
        <div class="pack ${n ? "open" : ""}">${OPEN.pack.map((p,k) => `<button class="pack-item ${k < n ? "lit" : ""}" data-act="ritItem" data-arg="${k}" id="pack-${p.id}" ${k < n ? "" : "disabled"}>
          <span class="pi">${OART.PROPS[p.id]}</span><span class="pn">${esc(L(p))}</span></button>`).join("")}</div>
        ${n ? `<div class="pack-line" id="pack-line"><div class="op-por bo sm">${OART.BO}</div><p><b>${esc(who("bo"))}</b>${esc(L(OPEN.pack[S.packSel ?? n-1].line))}</p></div>` : ""}
        ${n === 0 ? `<button class="btn-gold" data-act="ritOpen" id="rit-open">${esc(OT("packOpen"))}</button>`
          : n >= OPEN.pack.length ? `<button class="btn-gold" data-act="ritGo" data-arg="card" id="rit-next">${esc(OT("next"))} →</button>` : ""}</div>`;
  } else {
    const ty = OPEN.types[seekerType()];
    body = `${ritAmo(fill(L(OPEN.cardLine), {name:S.name}), "happy")}
      <div class="seeker-card" id="seeker-card">
        <div class="sc-head"><span>🍄${lang() === "zh" ? "" : " WANDERQUEST"}</span><b>${esc(OT("cardTitle"))}</b></div>
        <div class="sc-body"><div class="sc-photo">${OART.amo("happy")}</div>
          <dl><dt>${esc(OT("cardName"))}</dt><dd id="sc-name">${esc(S.name)}</dd>
              <dt>${esc(OT("cardType"))}</dt><dd>${ty.ico} ${esc(L(ty))}</dd>
              <dt>${esc(OT("cardNo"))}</dt><dd class="mono">${esc(S.pid)}</dd></dl></div>
        <div class="sc-stamp" aria-label="${esc(OT("cardStamp"))}"><span>${esc(OT("cardStamp"))}</span></div>
      </div>
      <div class="rit-actions"><button class="btn-gold big" data-act="ritDone" id="rit-done">${esc(OT("setOff"))}</button></div>`;
  }
  return `<div class="rit-root"><div class="rit-bg">${OART.shop(lang() === "zh", "neutral")}</div>
    <div class="op-top"><button class="op-chip" data-act="opSound" id="op-sound">${esc(SND.on ? OT("soundOn") : OT("soundOff"))}</button></div>
    <main class="rit-main step-${step}">${body}</main></div>`;
}
function ritAfterRender(){
  if (S.ritStep === "card") { SND.thump(); buzz(25); }
  const pad = document.getElementById("thumb-pad"); if (!pad || S.signed) return;
  const prog = document.getElementById("thumb-prog"), msg = document.getElementById("thumb-msg"), C = 2*Math.PI*54;
  prog.style.strokeDasharray = C; prog.style.strokeDashoffset = C;
  let t0 = 0, raf = 0, holding = false;
  const HOLD = 2000;
  const frame = () => {
    const p = Math.min(1, (performance.now() - t0) / HOLD);
    prog.style.strokeDashoffset = C * (1 - p); pad.style.setProperty("--p", p);
    if (p >= 1) { holding = false; return ritSigned(); }
    raf = requestAnimationFrame(frame);
  };
  const start = e => { if (holding || S.signed) return; if (e && e.cancelable) e.preventDefault(); SND.init(); holding = true; t0 = performance.now(); pad.classList.add("holding"); buzz(15); raf = requestAnimationFrame(frame); };
  const end = () => { if (!holding) return; holding = false; cancelAnimationFrame(raf); pad.classList.remove("holding"); prog.style.strokeDashoffset = C; pad.style.setProperty("--p", 0); msg.textContent = OT("holdMore"); };
  pad.addEventListener("pointerdown", start);
  ["pointerup","pointerleave","pointercancel"].forEach(ev => pad.addEventListener(ev, end));
  pad.addEventListener("contextmenu", e => e.preventDefault());
  pad.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) start(e); });
  pad.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") end(); });
}
function ritSigned(){
  S.signed = true; S.signedAt = Date.now(); logEv("signed"); save();
  SND.thump(); setTimeout(() => SND.yes(), 250); buzz([30, 40, 60]);
  render();
}
let PACK_T = null;
Object.assign(ACT, {
  ritPick(a){
    const [qi, k] = a.split(":"); S.quizA = (S.quizA || []).slice(0, +qi); S.quizA[+qi] = k; SND.chime(+qi); buzz(10);
    S.ritStep = +qi < 2 ? "q" + (+qi + 1) : "result";
    if (S.ritStep === "result") { S.seeker = seekerType(); S.route = OPEN.types[S.seeker].route; logEv("seeker", S.seeker); }
    save(); render(); window.scrollTo(0,0);
  },
  ritGo(step){ S.ritStep = step; save(); render(); window.scrollTo(0,0); },
  ritOpen(){
    SND.pop(); S.packN = 0; S.packSel = null;
    const tick = () => { S.packN = (S.packN || 0) + 1; S.packSel = null; SND.chime(S.packN); buzz(8); save(); render();
      if (S.packN < OPEN.pack.length) PACK_T = setTimeout(tick, REDUCED ? 30 : 1500); };
    clearTimeout(PACK_T); tick();
  },
  ritItem(k){ S.packSel = +k; render(); },
  ritDone(){
    clearTimeout(PACK_T);
    S.ritDone = true; S.histRead = true; S.flags.tutorial = true; S.screen = "game"; S.scene = "map";
    if (!S.t0) S.t0 = Date.now();
    logEv("ritual_done", S.seeker || ""); save(); SND.stop(); render(); window.scrollTo(0,0);
  }
});
function startOpening(replay){ S.screen = "opening"; S.opPhase = "hook"; S.opI = 0; S.opReplay = !!replay; save(); render(); }

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.act !== "backdrop") ev.stopPropagation();
  try { fn(el.dataset.arg, el, ev); } catch(e){ console.error(e); toast("⚠️ " + e.message); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && M) closeModal();
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches("g[data-act]")) { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); }
});
window.addEventListener("error", e => { console.error("WQ error", e.message); });

/* inject puzzle images as CSS classes (data URIs contain no double quotes) */
const pzStyle = document.createElement("style");
pzStyle.textContent = `.pz{background-image:url("${ART.PUZZLE_URI}")}.dz0{background-image:url("${ART.DECOY_URI[0]}")}.dz1{background-image:url("${ART.DECOY_URI[1]}")}.pr{background-image:url("${ART.PRACTICE_URI}")}`;
document.head.appendChild(pzStyle);

/* expose read-only hooks for automated tests */
window.WQ = { get state(){ return clone(S); }, LOGIC_ANSWER, LOGIC_SOLUTIONS, VERSION, ovCount, MECHDATA, placeDone };

if (S.screen === "tutorial") TUT = null;
render();
})();

</script>
